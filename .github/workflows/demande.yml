name: Demande d'épisode (depuis le formulaire)
on:
  issues: { types: [opened] }
  issue_comment: { types: [created] }
permissions: { contents: write, issues: write, actions: write }
jobs:
  lire:
    if: contains(github.event.issue.labels.*.name, 'episode') && (github.event_name == 'issues' || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    outputs: { mode: "${{ steps.s.outputs.mode }}", path: "${{ steps.s.outputs.path }}", reponse: "${{ steps.s.outputs.reponse }}", de: "${{ steps.s.outputs.de }}", fin: "${{ steps.s.outputs.fin }}", arg: "${{ steps.s.outputs.arg }}", auto: "${{ steps.s.outputs.auto }}" }
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: python .github/scripts/issue_script.py
      - name: Garder le script dans le dépôt
        if: steps.s.outputs.mode != 'rien'
        run: |
          git config user.name "sounsouni-studio"; git config user.email "studio@sounsouni.pro"
          git add demandes && (git commit -m "Script de la demande #${{ github.event.issue.number }}" && git push || true)
      - name: Lancer
        if: steps.s.outputs.mode != 'rien'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          N=${{ github.event.issue.number }}; C="repos/${{ github.repository }}/issues/$N/comments"
          case "${{ steps.s.outputs.mode }}" in
            format) gh workflow run format.yml -f issue="$N" -f auto="${{ steps.s.outputs.auto }}"
              gh api "$C" -f body="⏳ C'est parti : l'assistant met le script au format sur GitHub (5 à 10 minutes). Vous pouvez fermer la page." > /dev/null; exit 0;;
            importer|annuler) gh workflow run import.yml -f issue="$N" -f mode="${{ steps.s.outputs.mode }}" -f arg="${{ steps.s.outputs.arg }}"
              if [ "${{ steps.s.outputs.mode }}" = annuler ]; then M="⏳ C'est parti : l'application retire les images de cet import (environ 1 minute)."; else M="⏳ C'est parti : l'application range les images Gemini (environ 10 minutes)."; fi
              gh api "$C" -f body="$M" > /dev/null; exit 0;;
            minivideo) set -- ${{ steps.s.outputs.arg }}; gh workflow run video.yml -f issue="$N" -f mode=preparer -f perso="$1" -f sorte="$2" -f fichier="$3"
              gh api "$C" -f body="⏳ C'est parti : l'application découpe la mini-vidéo de $1 et décrit chaque image (environ 5 minutes)." > /dev/null; exit 0;;
            garder) A="${{ steps.s.outputs.arg }}"; NOM="${A##* }"; REP="${A% *}"; gh workflow run video.yml -f issue="$N" -f mode=garder -f nom="$NOM" -f reponse="$REP"
              gh api "$C" -f body="⏳ C'est parti : l'application range les images de $NOM dans le studio (environ 10 minutes)." > /dev/null; exit 0;;
            relecture) gh workflow run relecture.yml -f issue="$N"
              gh api "$C" -f body="⏳ C'est parti : le relecteur lit l'histoire et regarde chaque plan (environ 3 minutes)." > /dev/null; exit 0;;
            essai) gh workflow run essai-code.yml -f issue="$N" -f branche="${{ steps.s.outputs.arg }}" -f script="${{ steps.s.outputs.path }}"
              gh api "$C" -f body="⏳ C'est parti : l'application essaie la modification du code (environ 10 minutes)." > /dev/null; exit 0;;
          esac
          if [ "${{ steps.s.outputs.mode }}" = "fiche" ]; then
            gh workflow run fiche.yml -f script="${{ steps.s.outputs.path }}" -f issue="${{ github.event.issue.number }}"
            gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f body="⏳ C'est parti : l'application prépare la fiche Gemini (environ 3 minutes)." > /dev/null; exit 0
          fi
          gh workflow run episode.yml -f script="${{ steps.s.outputs.path }}" -f issue="${{ github.event.issue.number }}" -f apercu="${{ steps.s.outputs.mode == 'apercu' }}" \
            -f choix="${{ steps.s.outputs.reponse }}" -f de="${{ steps.s.outputs.de }}" -f fin="${{ steps.s.outputs.fin }}"
          if [ -n "${{ steps.s.outputs.reponse }}" ]; then M="le nouvel aperçu avec vos choix (${{ steps.s.outputs.reponse }}, environ 10 minutes)"
          elif [ "${{ steps.s.outputs.mode }}" = "apercu" ]; then M="l'aperçu des plans et les planches à valider (environ 10 minutes)"; else M="la vidéo complète (environ 30 minutes)"; fi
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f body="⏳ C'est parti : l'application fabrique $M. Vous serez prévenu ici." > /dev/null
