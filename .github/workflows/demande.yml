name: Demande d'épisode (depuis le formulaire)
on:
  issues: { types: [opened] }
  issue_comment: { types: [created] }
permissions: { contents: write, issues: write, actions: write }
jobs:
  lire:
    if: contains(github.event.issue.labels.*.name, 'episode') && (github.event_name == 'issues' || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    outputs: { mode: "${{ steps.s.outputs.mode }}", path: "${{ steps.s.outputs.path }}", reponse: "${{ steps.s.outputs.reponse }}", de: "${{ steps.s.outputs.de }}", fin: "${{ steps.s.outputs.fin }}" }
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: python .github/scripts/issue_script.py
      - name: Garder le script dans le dépôt
        if: steps.s.outputs.mode != 'rien'
        run: |
          git config user.name "sounsouni-studio"; git config user.email "studio@sounsouni.pro"
          git add demandes && (git commit -m "Script de la demande #${{ github.event.issue.number }}" && git push || true)
      - name: Lancer
        if: steps.s.outputs.mode != 'rien'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "${{ steps.s.outputs.mode }}" = "fiche" ]; then
            gh workflow run fiche.yml -f script="${{ steps.s.outputs.path }}" -f issue="${{ github.event.issue.number }}"
            gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f body="⏳ C'est parti : l'application prépare la fiche Gemini (environ 3 minutes)." > /dev/null; exit 0
          fi
          gh workflow run episode.yml -f script="${{ steps.s.outputs.path }}" -f issue="${{ github.event.issue.number }}" -f apercu="${{ steps.s.outputs.mode == 'apercu' }}" \
            -f choix="${{ steps.s.outputs.reponse }}" -f de="${{ steps.s.outputs.de }}" -f fin="${{ steps.s.outputs.fin }}"
          if [ -n "${{ steps.s.outputs.reponse }}" ]; then M="le nouvel aperçu avec vos choix (${{ steps.s.outputs.reponse }}, environ 10 minutes)"
          elif [ "${{ steps.s.outputs.mode }}" = "apercu" ]; then M="l'aperçu des plans et les planches à valider (environ 10 minutes)"; else M="la vidéo complète (environ 30 minutes)"; fi
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f body="⏳ C'est parti : l'application fabrique $M. Vous serez prévenu ici." > /dev/null
