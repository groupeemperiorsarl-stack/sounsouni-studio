name: Images sans Gemini (modèle libre FLUX Kontext)
run-name: "Demande ${{ inputs.issue }} · images libres ${{ inputs.groupes }}"
on:
  workflow_dispatch:
    inputs:
      issue: { description: "Numéro de la demande", required: true }
      groupes: { description: "Numéros des demandes de la fiche (ex. 3,4) ; vide = toutes les scènes à deux et plans dans le décor", default: "" }
permissions: { contents: write, issues: write, actions: write }
env: { GH_TOKEN: "${{ github.token }}", N: "${{ github.event.inputs.issue }}", HF_TOKEN: "${{ secrets.HF_TOKEN }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }   # jeton Hugging Face gratuit (plus d'images par jour) : secret HF_TOKEN
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy pillow soundfile librosa scipy opencv-python-headless gradio_client
      - run: git fetch -q origin fichiers
      - name: Fabriquer les images
        run: python .github/scripts/image_libre.py "${{ github.event.inputs.groupes }}"
      - name: Ranger (comme les images Gemini)
        run: |
          F=$(cat faits.txt); RT=$(cat rates.txt 2>/dev/null)
          [ -z "$F" ] && { gh api "repos/${{ github.repository }}/issues/$N/comments" -f body="⚠️ Aucune image bonne n'a pu être faite par le modèle libre : ${RT:-raison inconnue}. Les images ratées ne sont pas rangées. Réessayez plus tard (ou avec Gemini)." > /dev/null; exit 0; }
          git config user.name "sounsouni-studio"; git config user.email "studio@sounsouni.pro"
          git add demandes/gemini/$N && git commit -qm "Images faites par le modèle libre (demande #$N)" && for k in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
          gh workflow run import.yml -f issue=$N -f mode=importer -f arg="$F"
          M="🎨 Images faites sans Gemini par le modèle libre et vérifiées une par une ($F) : rangement en cours."; [ -n "$RT" ] && M="$M"$'\n'"⚠️ Pas rangées (ratées) : $RT"
          gh api "repos/${{ github.repository }}/issues/$N/comments" -f body="$M" > /dev/null
