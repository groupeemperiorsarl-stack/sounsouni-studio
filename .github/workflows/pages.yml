name: Page Studio mobile en ligne (GitHub Pages)
# La page est servie à une vraie adresse https (copier, partager vers Gemini, enregistrer une image marchent sur le téléphone) et se met à jour toute seule.
# Une seule fois, sur GitHub : Settings → Pages → Source : « GitHub Actions ».
on:
  push: { branches: [main], paths: ["outils/studio_mobile.html", ".github/workflows/pages.yml"] }
  workflow_dispatch:
  schedule: [{ cron: "23 * * * *" }]   # une fois Pages allumé par Issa, la page se met en ligne toute seule dans l'heure
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publier:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: outils }
      - run: mkdir -p site && cp outils/studio_mobile.html site/index.html && cp outils/studio_mobile.html site/studio_mobile.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5   # essaie d'allumer GitHub Pages tout seul (source « GitHub Actions »)
        with: { enablement: true }
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
