name: Ménage automatique de la place (vidéos anciennes)
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_run: { workflows: ["Fabriquer un épisode (20 ordinateurs en parallèle)"], types: [completed] }
  workflow_dispatch:
    inputs:
      essai: { description: "1 = montrer seulement, sans rien supprimer", default: "0" }
      forcer: { description: "1 = faire aussi le grand ménage de l'historique (essai seulement si essai=1)", default: "0" }
permissions: { contents: write }
jobs:
  menage:
    runs-on: ubuntu-latest
    outputs: { grand: "${{ steps.m.outputs.grand }}" }
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python .github/scripts/menage.py
        env: { GH_TOKEN: "${{ github.token }}", ESSAI: "${{ github.event.inputs.essai }}", FORCER: "${{ github.event.inputs.forcer }}" }
  grand_menage:   # le dépôt dépasse 60 % de 5 Go : on retire de l'historique les gros fichiers qui n'existent plus (rien d'actuel n'est touché)
    needs: menage
    if: needs.menage.outputs.grand == 'oui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install -q git-filter-repo
      - run: bash .github/scripts/grand_menage.sh "$PWD" "${{ github.event.inputs.essai == '1' && 'essai' || 'vrai' }}"
        env: { URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" }
