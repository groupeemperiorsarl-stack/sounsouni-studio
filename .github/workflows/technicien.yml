name: Technicien (cherche et répare, depuis la page Studio mobile)
on:
  issue_comment: { types: [created] }
  workflow_dispatch:
    inputs:
      issue: { description: "Numéro de la demande « 🛠 Technicien »", required: true }
      message: { description: "Numéro du message à traiter (vide = le dernier d'Issa)", default: "" }
      sans_cles: { description: "true = essai du dernier secours (comme si toutes les clés étaient épuisées)", default: "false" }
permissions: { contents: write, issues: write, actions: write }
concurrency: { group: technicien, cancel-in-progress: false }
jobs:
  technicien:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.issue.labels.*.name, 'technicien') && github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Le technicien cherche et répare
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
          MESSAGE_ID: ${{ github.event.comment.id || github.event.inputs.message }}
          GEMINI_API_KEY: ${{ github.event.inputs.sans_cles != 'true' && secrets.GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ github.event.inputs.sans_cles != 'true' && secrets.GROQ_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ github.event.inputs.sans_cles != 'true' && secrets.CEREBRAS_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ github.event.inputs.sans_cles != 'true' && secrets.OPENROUTER_API_KEY || '' }}
          SECOURS_LIBRE: "1"
        run: |
          git config user.name technicien; git config user.email studio@sounsouni.pro
          set +e; node .github/scripts/technicien.mjs; c=$?; echo "code=$c" >> $GITHUB_OUTPUT; [ $c = 0 ] || [ $c = 3 ]
      - name: Dernier secours sans clé - modèle libre gpt-oss-20b sur la machine
        if: steps.t.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
          MESSAGE_ID: ${{ github.event.comment.id || github.event.inputs.message }}
        run: |
          set -e; sudo mkdir -p /mnt/m && sudo chown $USER /mnt/m
          (curl -sfL -o /mnt/m/model.gguf https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf) &
          git clone -q --depth 1 https://github.com/ggml-org/llama.cpp /mnt/m/src
          cmake -S /mnt/m/src -B /mnt/m/build -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build /mnt/m/build --target llama-server -j $(nproc) > /dev/null; wait
          export LD_LIBRARY_PATH=/mnt/m/build/bin; /mnt/m/build/bin/llama-server -m /mnt/m/model.gguf -c 32768 -t $(nproc) --jinja --port 8080 > /mnt/m/serveur.log 2>&1 &
          for i in $(seq 1 120); do curl -s localhost:8080/health | grep -q ok && break; sleep 5; done
          git config user.name technicien; git config user.email studio@sounsouni.pro
          LOCAL_LLM_URL=http://127.0.0.1:8080/v1/chat/completions MAX_MIN=50 node .github/scripts/technicien.mjs
