name: test-runner
on:
  push:
    paths: ['jobs/test.txt']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          nproc; free -g; df -h / | tail -1
          mkdir -p out && { nproc; free -g; } > out/runner_info.txt
          git config user.name "sounsouni-bot"; git config user.email "bot@sounsouni.pro"
          git fetch origin rendus || true
          git checkout -B rendus
          git add out/runner_info.txt && git commit -m "info runner" && git push -f origin rendus
