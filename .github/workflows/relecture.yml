name: Relecture automatique (après chaque aperçu)
run-name: "Demande ${{ inputs.issue }} · relecture"
on:
  workflow_dispatch:
    inputs:
      issue: { description: "Numéro de la demande", required: true }
permissions: { contents: write, issues: write, models: read }
concurrency: { group: "relecture-${{ github.event.inputs.issue }}", cancel-in-progress: true }
jobs:
  relire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pillow
      - name: Le relecteur lit l'histoire et regarde chaque plan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.inputs.issue }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python .github/scripts/relecture.py
      - name: Prévenir si la relecture n'a pas pu se faire
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api "repos/${{ github.repository }}/issues/${{ github.event.inputs.issue }}/comments" -f body="🔎 La relecture automatique n'a pas pu se faire (les IA gratuites sont saturées). Écrivez **relecture** plus tard pour la relancer." > /dev/null
